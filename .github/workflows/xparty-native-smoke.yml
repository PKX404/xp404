name: XParty native Android emulator installation smoke test
on:
  workflow_dispatch:
  push:
    branches: ['feature/xparty-fully-native-android-20261103']
    paths:
      - 'android-native/**'
      - '.github/workflows/xparty-native-smoke.yml'
jobs:
  launch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build native APK
        run: gradle --no-daemon -p android-native :app:assembleDebug
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disable-animations: true
          script: |
            adb install -r android-native/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.pkx404.xparty.nativev34/com.pkx404.xparty.nativeapp.MainActivity
            sleep 12
            adb shell pidof com.pkx404.xparty.nativev34
            adb logcat -d -s AndroidRuntime:E > /tmp/xparty-native-errors.txt
            if grep -q 'FATAL EXCEPTION' /tmp/xparty-native-errors.txt; then cat /tmp/xparty-native-errors.txt; exit 1; fi
            echo 'Native XParty installed and launched without a fatal exception.'
