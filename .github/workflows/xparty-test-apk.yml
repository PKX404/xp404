name: Xparty Android test APK
on:
  push:
    branches: [main]
    paths:
      - 'android-test/**'
      - '.github/workflows/xparty-test-apk.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Xparty
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable debug APK
        working-directory: android-test
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xparty-render-test-apk
          path: android-test/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
