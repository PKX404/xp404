name: Build XParty Native v0.3.1 APK
on:
  push:
    branches:
      - feature/xparty-native-playback-immersive-icon-20261109
    paths:
      - 'android-native/**'
      - '.github/workflows/xparty-fully-native-android.yml'
  workflow_dispatch:
jobs:
  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build native Android APK
        working-directory: android-native
        run: gradle --no-daemon :app:assembleDebug
      - name: Check APK exists
        run: test -s android-native/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XParty-Native-v0.3.1-Playback-Immersive-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
