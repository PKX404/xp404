name: Verify native Render room service
on:
  push:
    branches: [feature/xparty-native-parity-v03-20261109]
    paths:
      - '.github/workflows/native-service-smoke.yml'
      - 'tests/native-service-smoke.mjs'
  workflow_dispatch:
jobs:
  native-room-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies
        run: npm ci --omit=dev
      - name: Test independent XParty Native backend and live rooms
        run: node tests/native-service-smoke.mjs
