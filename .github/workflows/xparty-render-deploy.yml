name: Deploy Xparty to Render
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'server.mjs'
      - 'room-*.mjs'
      - 'render.yaml'
      - '.github/workflows/xparty-render-deploy.yml'
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render using a configured private secret
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$RENDER_DEPLOY_HOOK_URL" ]]; then
            code=$(curl --silent --show-error --location --request POST --output /tmp/deploy-response --write-out '%{http_code}' "$RENDER_DEPLOY_HOOK_URL")
            echo "RENDER_HOOK_STATUS=$code"
          elif [[ -n "$RENDER_API_KEY" && -n "$RENDER_SERVICE_ID" ]]; then
            code=$(curl --silent --show-error --request POST --output /tmp/deploy-response --write-out '%{http_code}' \
                -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
                -d '{}' "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
            echo "RENDER_API_STATUS=$code"
          else
            echo "RENDER_DEPLOY_NOT_CONFIGURED: configure Render Git auto-deploy or a repository secret."
            exit 0
          fi
          if [[ "$code" != 200 && "$code" != 201 && "$code" != 202 ]]; then
            head -c 500 /tmp/deploy-response || true
            exit 1
          fi
