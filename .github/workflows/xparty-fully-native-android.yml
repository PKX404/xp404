name: XParty Native v0.4.1 MicFix QA (install alongside original)
on:
  push:
    branches: [feature/xparty-native-v041-stability-landscape-20261110, fix/native-v041-microphone-tiling-20261110]
    paths:
      - 'android-native/**'
      - '.github/workflows/xparty-fully-native-android.yml'
  pull_request:
    branches: [feature/xparty-native-v041-stability-landscape-20261110]
    paths:
      - 'android-native/**'
      - '.github/workflows/xparty-fully-native-android.yml'
  workflow_dispatch:
jobs:
  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build signed and minified native APKs for each processor
        working-directory: android-native
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify size and ABI availability
        shell: bash
        run: |
          set -e
          ls -lh android-native/app/build/outputs/apk/release/*.apk
          test -s android-native/app/build/outputs/apk/release/app-universal-release.apk
          test -s android-native/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          test -s android-native/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XParty-Native-v0.4.1-MicFixQA-Release-APKs
          path: android-native/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
  startup-smoke:
    needs: android-native
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: XParty-Native-v0.4.1-MicFixQA-Release-APKs
          path: output
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -e
            adb install -r output/app-universal-release.apk
            adb logcat -c
            adb shell am start -W -n com.pkx404.xpartynative.micfixqa/com.pkx404.xpartynative.MainActivity
            sleep 6
            adb shell pidof com.pkx404.xpartynative.micfixqa
            adb exec-out screencap -p > output/native-v0.4.1-home.png
            adb shell uiautomator dump /sdcard/v04.xml >/dev/null 2>&1 || true
            adb pull /sdcard/v04.xml output/native-v0.4.1-window.xml >/dev/null 2>&1 || true
            adb shell am force-stop com.pkx404.xpartynative.micfixqa
            adb shell am start -W -n com.pkx404.xpartynative.micfixqa/com.pkx404.xpartynative.MainActivity
            sleep 2
            adb shell pidof com.pkx404.xpartynative.micfixqa
            echo "XParty Native v0.4.1 optimized release launched twice"
            # Exercise the actual NativeCallController microphone action, not just app startup.
            adb shell pm grant com.pkx404.xpartynative.micfixqa android.permission.RECORD_AUDIO
            adb shell am force-stop com.pkx404.xpartynative.micfixqa
            adb logcat -c
            adb shell am start -W -n com.pkx404.xpartynative.micfixqa/com.pkx404.xpartynative.MainActivity --ez xparty_mic_smoke true
            sleep 9
            adb shell pidof com.pkx404.xpartynative.micfixqa
            adb logcat -d -v time -s XPartyMicSmoke:I '*:S' > output/native-v0.4.1-mic-smoke.log
            cat output/native-v0.4.1-mic-smoke.log
            grep -q 'MIC_TAP_RETURNED' output/native-v0.4.1-mic-smoke.log
            grep -q 'MIC_ACTIVE_PASS' output/native-v0.4.1-mic-smoke.log
            echo "XParty Native WebRTC MIC action survived and activated"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XParty-Native-v0.4.1-Home-Screenshot
          path: output/native-v0.4.1-*
          retention-days: 7
