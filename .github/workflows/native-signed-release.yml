name: XParty owner-signed Android release
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-24.04
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and verify against the owner's pinned signing certificate
        env:
          XP_KEY_B64: ${{ secrets.XP_KEYSTORE_B64 }}
          XP_STORE_PASSWORD: ${{ secrets.XP_STORE_PASSWORD }}
          XP_KEY_ALIAS: ${{ secrets.XP_KEY_ALIAS }}
          XP_KEY_PASSWORD: ${{ secrets.XP_KEY_PASSWORD }}
          XP_CERT_SHA256: ${{ vars.XP_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          : "${XP_KEY_B64:?}" "${XP_STORE_PASSWORD:?}" "${XP_KEY_ALIAS:?}" "${XP_KEY_PASSWORD:?}" "${XP_CERT_SHA256:?}"
          umask 077
          export XP_KEYSTORE="$RUNNER_TEMP/xparty-release.p12"
          trap 'rm -f "$XP_KEYSTORE"' EXIT
          printf '%s' "$XP_KEY_B64" | base64 --decode > "$XP_KEYSTORE"
          unset XP_KEY_B64
          gradle -p android-native :app:assembleRelease
          apk=android-native/app/build/outputs/apk/release/app-universal-release.apk
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          actual=$("$signer" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$actual" = "${XP_CERT_SHA256,,}"
          mkdir release-output
          cp "$apk" release-output/XParty-Universal.apk
          cd release-output && sha256sum XParty-Universal.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: XParty-owner-signed
          path: release-output/
