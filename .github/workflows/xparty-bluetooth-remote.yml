name: Build XParty Bluetooth Remote
on:
  workflow_dispatch:
  push:
    branches: [release/xparty-remote-v2-electric-blue-20261108]
    paths:
      - 'bluetooth-remote/**'
      - '.github/workflows/xparty-bluetooth-remote.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble debug remote APK
        working-directory: bluetooth-remote
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: XParty-Remote-Electric-Blue-v2.0.0-debug
          path: bluetooth-remote/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
