name: Xparty Beta Android APK
on:
  push:
    branches: ['beta/xparty-beta-20261029']
    paths:
      - 'android-test/**'
      - '.github/workflows/xparty-test-apk.yml'
  workflow_dispatch:
jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Xparty
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable debug APK
        working-directory: android-test
        run: gradle --no-daemon :app:assembleDebug
      - name: Check public Render URL
        shell: bash
        continue-on-error: true
        run: |
          code=$(curl -L --connect-timeout 15 --max-time 65 -sS -o /tmp/xparty-response -w '%{http_code}' https://xp404.onrender.com/health) || code="000"
          echo "XPARTY_RENDER_HTTP_STATUS=$code"
          if test -f /tmp/xparty-response; then head -c 800 /tmp/xparty-response; fi
          echo
      - name: Name the side-installable Beta APK
        run: cp android-test/app/build/outputs/apk/debug/app-debug.apk android-test/app/build/outputs/apk/debug/Xparty-Beta-1.1.2-beta.1.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xparty-Beta-1.1.2-beta.1
          path: android-test/app/build/outputs/apk/debug/Xparty-Beta-1.1.2-beta.1.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish side-version prerelease with direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="xparty-beta-1.1.2-beta.1"
          FILE="android-test/app/build/outputs/apk/debug/Xparty-Beta-1.1.2-beta.1.apk"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "Xparty Beta 1.1.2-beta.1" --notes "Side-installed Android beta, isolated from main and production deployment. Loads current https://xp404.onrender.com. APK build passed; device playback, microphone and search need live validation."
          gh release upload "$TAG" "$FILE" --clobber
