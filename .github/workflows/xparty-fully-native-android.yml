name: XParty 0.5.3 Profile and Share
on:
  push:
    branches: [feature/native-v050-room-audio-chat, fix/native-v050-play-protect, feature/native-v052-soundcloud-chat, feature/native-v053-profile-share]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && node --test tests/provider-room.test.mjs tests/providers-extra.test.mjs tests/companion.test.mjs tests/native-soundcloud-chat.test.mjs tests/native-profile-share.test.mjs
      - run: gradle -p android-native :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify APK does not request sensitive notification, SMS or accessibility access
        shell: bash
        run: |
          set -euo pipefail
          apk="android-native/app/build/outputs/apk/release/app-universal-release.apk"
          test -s "$apk"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt_bin"
          "$aapt_bin" dump xmltree "$apk" AndroidManifest.xml > /tmp/xparty-final-merged-manifest.txt
          if grep -E 'android.permission.(BIND_NOTIFICATION_LISTENER_SERVICE|READ_SMS|RECEIVE_SMS|BIND_ACCESSIBILITY_SERVICE)|android.service.notification.NotificationListenerService|android.accessibilityservice.AccessibilityService' /tmp/xparty-final-merged-manifest.txt; then
            echo "::error::APK still declares high-risk sideload access"
            exit 1
          fi
          echo "Verified: no SMS, notification listener, or accessibility declarations in final APK"
      - uses: actions/upload-artifact@v4
        with:
          name: XParty-0.5.3-Universal-Profile-Share
          path: android-native/app/build/outputs/apk/release/app-universal-release.apk
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-boot-anim -gpu swiftshader_indirect -camera-front emulated -camera-back emulated -noaudio
          script: bash android-native/check-call-startup.sh
