<script>
(() => {
  window.xpartyGeneration="__GENERATION__";
  const events=[];
  window.xpartyReadEvents=()=>events.splice(0);
  window.XpartyYT={};
  for(const name of ["onReady","changed","state","progress","error","blocked","providerEvent"]){
    XpartyYT[name]=(...args)=>{
      if(events.length>=32)events.shift();
      events.push([name,...args]);
    };
  }
})();
</script>
