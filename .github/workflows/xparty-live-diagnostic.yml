name: Diagnose XParty live room connections
on:
  push:
    branches: [fix/xparty-live-room-reconnect-20261108]
    paths:
      - 'tests/live-endpoint-probe.mjs'
      - '.github/workflows/xparty-live-diagnostic.yml'
  workflow_dispatch:
jobs:
  probe-live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - name: Diagnose public DNS, TLS and Render edge routing
        shell: bash
        run: |
          set +e
          echo "=== DNS RESOLUTION ==="
          getent ahostsv4 xp404.onrender.com | head -n 6
          echo "=== DNS OVER HTTPS HOST ==="
          getent ahostsv4 render.com | head -n 3
          echo "=== HTTP RESPONSE FROM RENDER ==="
          curl -v -L --connect-timeout 8 --max-time 25 -o /tmp/xparty-health https://xp404.onrender.com/health 2>&1 | tail -n 35
          echo "CURL_EXIT_CODE=${PIPESTATUS[0]}"
          head -c 240 /tmp/xparty-health || :
          echo
          echo "=== CONTROL WEBSITE ==="
          curl -sSL --connect-timeout 8 --max-time 15 -o /dev/null -w 'CONTROL_HTTP_STATUS=%{http_code}\\n' https://render.com || :
      - name: Check Render live HTTP, WebSocket origin and room creation
        run: node tests/live-endpoint-probe.mjs
