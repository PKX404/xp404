name: XParty 0.4.9 provider rooms and chat
on:
  push:
    branches: [feature/native-v049-provider-chat]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && node --test tests/provider-room.test.mjs tests/providers-extra.test.mjs tests/companion.test.mjs
      - run: gradle -p android-native :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: XParty-0.4.9-Universal
          path: android-native/app/build/outputs/apk/release/app-universal-release.apk
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-boot-anim -gpu swiftshader_indirect -camera-front emulated -camera-back emulated -noaudio
          script: bash android-native/check-call-startup.sh
