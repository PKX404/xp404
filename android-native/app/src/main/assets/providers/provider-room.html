<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{box-sizing:border-box}html,body,#player,#player>div,.provider-embed-mount,iframe{margin:0;width:100%;height:100%;border:0;background:#000}#player iframe{position:absolute;inset:0}
#art{width:45%;height:100%;object-fit:cover;position:absolute;left:0;top:0}
body.audio-art #player{position:absolute;left:45%;width:55%;height:100%}
#player{position:relative}</style></head>
<body><script type="application/json" id="source">__SOURCE__</script><img id="art" alt="" hidden><div id="player"></div><script>
window.addEventListener('error',e=>XpartyYT.providerEvent(document.documentElement.dataset.key||'','Player script failed: '+e.message,0,0));
window.addEventListener('unhandledrejection',e=>XpartyYT.providerEvent(document.documentElement.dataset.key||'',String(e.reason&&e.reason.message||'Player initialization failed'),0,0));
</script><script src="./providers.js"></script><script>

const {type,id,key}=JSON.parse(document.getElementById('source').textContent);
document.documentElement.dataset.key=key;
(async()=>{
let player;
const report=(kind,state=0,time=0)=>XpartyYT.providerEvent(key,kind,state,Number(time)||0);
const changed=e=>{if(player)report('state',e.data,player.getCurrentTime())};
const failed=e=>report(String(e&&e.message||'Provider player unavailable').slice(0,140));
try {
  const {createTwitchPlayer,createVimeoPlayer,createSoundCloudPlayer}=window.XPartyProviders;
  const creator=type==='twitch'?createTwitchPlayer:type==='soundcloud'?createSoundCloudPlayer:createVimeoPlayer;
  player=await creator(document.getElementById('player'),id,changed,failed,{timeoutMs:35000,onProgress:()=>{window.xpartyProgressCount=(window.xpartyProgressCount||0)+1;},onMetadata:sound=>{
    XpartyYT.metadata(key,sound&&sound.title||'',sound&&sound.user&&sound.user.username||'',sound&&sound.artwork_url||sound&&sound.user&&sound.user.avatar_url||'');
    const image=document.getElementById('art');
    const url=sound&&sound.artwork_url||sound&&sound.user&&sound.user.avatar_url;
    if(url&&new URL(url).protocol==='https:'){image.src=url;image.hidden=false;document.body.classList.add('audio-art');}
  }});
  window.xpartyTime=()=>player.getCurrentTime();
  window.xpartyState=()=>player.getPlayerState();
  // SoundCloud's official Widget API reports playback positions in milliseconds;
  // the adapter converts them to seconds before room synchronization.
  window.xpartySeek=t=>{if(player.canSeek!==false)player.seekTo(t)};
  window.xpartyPlay=p=>p?player.playVideo():player.pauseVideo();
  window.xpartySync=(p,t)=>{
    if(Math.abs(player.getCurrentTime()-t)>1.0)window.xpartySeek(t);
    if(p!==(player.getPlayerState()===1))window.xpartyPlay(p);
  };
  setInterval(()=>{report('progress',Math.round(player.getDuration()||0),player.getCurrentTime());if(player.getVideoLoadedFraction)XpartyYT.buffered(key,player.getVideoLoadedFraction());},500);
  report('ready');
} catch(error){failed(error)}
})();
</script></body></html>
