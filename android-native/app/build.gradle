plugins { id 'com.android.application' }
android {
    namespace 'com.pkx404.xparty.nativeapp'
    compileSdk 36
    defaultConfig {
        applicationId 'com.pkx404.xparty.nativev34'
        minSdk 26
        targetSdk 35
        versionCode 34
        versionName '34.0-original-ui-preview'
        buildConfigField 'String', 'DEFAULT_BACKEND', '"https://krezi.onrender.com"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false; debuggable false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { resources { excludes += ['META-INF/*.kotlin_module'] } }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'io.getstream:stream-webrtc-android:1.3.10'
}
